name: Deploy Scripture Study to Cloudflare (Worker)

# Needs repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  (required)   CLOUDFLARE_ACCOUNT_ID (optional)   OWNER_EMAIL (optional)
#   KAGGLE_API_TOKEN (optional: adds the narrated audio Bible recorded on Kaggle)
# The setup script is idempotent: it creates the D1 database, Pages project and email sign-in
# the first time, then just builds and deploys.
on:
  push:
    branches: [main, claude/affectionate-pasteur-c22ifu]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Skip when Cloudflare is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "No CLOUDFLARE_API_TOKEN secret yet — skipping deploy."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      # Michael's on-device voice files, hosted on the site (scripts/fetch_voice_model.py)
      - uses: actions/cache@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .voice-model-cache
          key: voice-model-${{ hashFiles('scripts/fetch_voice_model.py') }}
      # narrated audio Bible from Kaggle, kept between deploys (scripts/fetch_narration.py)
      - uses: actions/cache@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.KAGGLE_API_TOKEN != ''
        with:
          path: .narration-cache
          key: narration-${{ hashFiles('scripts/narration_sources.json') }}
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/cloudflare_setup.mjs
