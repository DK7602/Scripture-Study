# Scripture Study — Cloudflare Worker with static assets.
# scripts/cloudflare_setup.mjs fills in the D1 id and Access values and deploys.
name = "scripture-study"
main = "worker/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scripture-study"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
TEAM_DOMAIN = ""
POLICY_AUD = ""
MAX_USERS = "25"
