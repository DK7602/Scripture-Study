# Scripture Study — Cloudflare Worker with static assets (written by scripts/cloudflare_setup.mjs)
name = "scripture-study"
main = "worker/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/audio/*", "/feed/*"]

[[d1_databases]]
binding = "DB"
database_name = "scripture-study"
database_id = "f43b8c33-c44e-4e46-84a4-59e2abc5cdfb"

[vars]
TEAM_DOMAIN = "lucky-meadow-2aaf.cloudflareaccess.com"
POLICY_AUD = "ff754904ec644dd4a55295f0c24cd8d1c83052903256424838cccab255544f76"
MAX_USERS = "25"
